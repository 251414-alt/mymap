<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>내 주변 병원 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=26af8b5871fd92c2781d578f68c9982c&libraries=services&autoload=false"></script>

  <style>
    /* 전체 테마 및 둥글둥글 스타일 패키지 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: #4a4a4a;
      background-color: #fcf9f2;
    }

    .container {
      display: flex;
      height: 100%;
    }

    /* 포근한 느낌의 사이드바 */
    .sidebar {
      width: 380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background: #ffffff;
      box-shadow: 4px 0 20px rgba(0,0,0,0.05);
      z-index: 10;
    }

    /* 동글동글 검색창 */
    .search-box {
      padding: 20px 15px 10px 15px;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border: 2px solid #ffeaa7;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      background-color: #fffdf9;
    }

    .search-input:focus {
      border-color: #ffb142;
    }

    .search-button {
      padding: 0 20px;
      background: #ffb142;
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 말랑말랑 카테고리 탭 */
    .tab-container {
      display: flex;
      padding: 10px 15px;
      gap: 8px;
    }

    .tab-button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: #f1f2f6;
      font-size: 14px;
      font-weight: bold;
      color: #7f8c8d;
      cursor: pointer;
      border-radius: 20px;
      text-align: center;
    }

    .tab-button.active {
      color: #fff;
      background: #ff7675; /* 따뜻한 핑크레드 */
      box-shadow: 0 4px 8px rgba(255, 118, 117, 0.3);
    }

    /* 결과 병원 리스트 카드 */
    .result-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
    }

    .place-item {
      padding: 15px;
      background: #fffdf9;
      border: 2px solid #fcf7ed;
      cursor: pointer;
      border-radius: 18px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
