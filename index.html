<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오맵 내 주변 병원 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=26af8b5871fd92c2781d578f68c9982c&libraries=services&autoload=false"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Malgun Gothic', dotum, sans-serif;
      color: #333;
    }

    .container {
      display: flex;
      height: 100%;
    }

    /* 사이드바 디자인 개선 */
    .sidebar {
      width: 380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      z-index: 10;
      background: #fff;
    }

    /* 탭 메뉴 스타일 */
    .tab-container {
      display: flex;
      background: #f8f9fa;
      border-bottom: 2px solid #fee500; /* 카카오 옐로우 포인트 */
    }

    .tab-button {
      flex: 1;
      padding: 15px 0;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-button:hover {
      background: #f1f3f5;
    }

    .tab-button.active {
      color: #000;
      background: #fee500;
    }

    /* 결과 리스트 영역 */
    .result-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .place-item {
      padding: 15px;
      border-bottom: 1px solid #edf2f7;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
      margin-bottom: 5px;
    }

    .place-item:hover {
      background-color: #f8f9fa;
    }

    .place-name {
      font-weight: bold;
      font-size: 16px;
      color: #1a202c;
      margin-bottom: 5px;
    }

    .place-address {
      font-size: 13px;
      color: #718096;
      margin-bottom: 5px;
    }

    .place-phone {
      font-size: 12px;
      color: #3182ce;
    }

    /* 지도 영역 */
    #map {
      flex: 1;
      height: 100%;
    }

    /* 현재 위치 커스텀 오버레이 (파란 점) 스타일 */
    .my-location-marker {
      width: 14px;
      height: 14px;
      background: #007bff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,123,255,0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0,123,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,123,255,0); }
    }
  </style>
</head>
