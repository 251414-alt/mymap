<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오맵 현재 위치 기반 장소 검색</title>

  <!-- 카카오 지도 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=26af8b5871fd92c2781d578f68c9982c&libraries=services&autoload=false"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 35%;
      padding: 15px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #map {
      width: 65%;
      height: 100%;
    }

    .search-box {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 8px;
    }

    button {
      padding: 8px 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .place-item {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .place-item:hover {
      background-color: #f2f2f2;
    }

    .place-name {
      font-weight: bold;
    }

    .place-address {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽 -->
    <div class="sidebar">
      <div class="search-box">
        <input id="keywordInput" placeholder="검색어 입력" />
        <button id="keywordSearchBtn" disabled>검색</button>
        <button id="nearbySearchBtn" disabled>내 주변</button>
      </div>
      <div id="resultList"></div>
    </div>

    <!-- 오른쪽 -->
    <div id="map"></div>
  </div>

  <script>
    let map;
    let placesService;
    let markers = [];
    let currentPosition;

    kakao.maps.load(function () {
      if (!navigator.geolocation) {
        alert("위치 기능을 지원하지 않는 브라우저입니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        currentPosition = new kakao.maps.LatLng(lat, lng);

        // 지도 생성
        map = new kakao.maps.Map(document.getElementById("map"), {
          center: currentPosition,
          level: 5
        });

        // 현재 위치 마커
        new kakao.maps.Marker({
          position: currentPosition,
          map: map
        });

        // 장소 검색 객체
        placesService = new kakao.maps.services.Places(map);

        // 버튼 활성화
        document.getElementById("keywordSearchBtn").disabled = false;
        document.getElementById("nearbySearchBtn").disabled = false;
      });
    });

    document.getElementById("keywordSearchBtn").addEventListener("click", searchByKeyword);
    document.getElementById("nearbySearchBtn").addEventListener("click", searchNearby);

    // 키워드 검색
    function searchByKeyword() {
      const keyword = document.getElementById("keywordInput").value;
      if (!keyword) {
        alert("검색어를 입력하세요.");
        return;
      }

      placesService.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);
        } else {
          alert("검색 결과가 없습니다.");
        }
      });
    }

    // 현재 위치 기준 검색 (반경 1km)
    function searchNearby() {
      const keyword = document.getElementById("keywordInput").value || "편의점";

      placesService.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);
        } else {
          alert("주변에 결과가 없습니다.");
        }
      }, {
        location: currentPosition,
        radius: 1000
      });
    }

    // 결과 표시
    function displayPlaces(places) {
      const list = document.getElementById("resultList");
      list.innerHTML = "";
      clearMarkers();

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(place => {
        const position = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          position,
          map
        });

        markers.push(marker);
        bounds.extend(position);

        const item = document.createElement("div");
        item.className = "place-item";
        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">${place.address_name}</div>
        `;

        item.onclick = () => map.setCenter(position);
        list.appendChild(item);
      });

      map.setBounds(bounds);
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }
  </script>
</body>
</html>
