<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주변 병원 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=26af8b5871fd92c2781d578f68c9982c&libraries=services&autoload=false"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; font-family:'Malgun Gothic', sans-serif; }
    .container { display:flex; height:100%; }

    .sidebar {
      width:380px; display:flex; flex-direction:column;
      background:#fff; box-shadow:2px 0 10px rgba(0,0,0,0.1); z-index:10;
    }

    .search-box {
      padding:12px; display:flex; gap:8px; border-bottom:1px solid #eee;
    }

    .search-box input {
      flex:1; padding:10px 12px; border-radius:20px; border:1px solid #ddd;
    }

    .search-box button {
      padding:0 16px; border-radius:20px; border:none;
      background:#fee500; font-weight:bold; cursor:pointer;
    }

    .tab-container {
      display:flex; border-bottom:2px solid #fee500;
    }

    .tab-button {
      flex:1; padding:12px 0; border:none;
      background:none; font-weight:bold; cursor:pointer; color:#666;
    }

    .tab-button.active {
      background:#fee500; color:#000;
    }

    .result-container {
      flex:1; overflow-y:auto; padding:10px;
    }

    .place-item {
      padding:14px; border-bottom:1px solid #eee; cursor:pointer;
    }

    .place-item:hover {
      background:#f8f9fa;
    }

    .place-name { font-weight:bold; }
    .place-address { font-size:13px; color:#666; }

    #map { flex:1; height:100%; }

    .my-location-btn {
      position:absolute; right:30px; bottom:30px;
      width:56px; height:56px; border-radius:50%;
      background:#007bff; color:#fff; font-size:22px;
      border:none; cursor:pointer; z-index:20;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="sidebar">
    <div class="search-box">
      <input id="keyword" placeholder="지역 또는 병원 이름 검색" />
      <button onclick="searchHospitals()">검색</button>
    </div>

    <div class="tab-container">
      <button class="tab-button active" onclick="switchTab('이비인후과', this)">이비인후과</button>
      <button class="tab-button" onclick="switchTab('소아과', this)">소아과</button>
      <button class="tab-button" onclick="switchTab('내과', this)">내과</button>
    </div>

    <div id="resultList" class="result-container">
      <div style="padding:20px;text-align:center;color:#999;">
        지역을 검색하거나 진료과를 선택하세요
      </div>
    </div>
  </div>

  <div id="map"></div>
  <button class="my-location-btn" onclick="moveToMyLocation()">📍</button>
</div>

<script>
let map, placesService;
let markers = [];
let currentPosition = null;
let currentCategory = '이비인후과';
let isNearMode = false;

/* 지도 초기화 */
kakao.maps.load(() => {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(36.5, 127.8),
    level: 13
  });

  placesService = new kakao.maps.services.Places();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      currentPosition = new kakao.maps.LatLng(
        pos.coords.latitude,
        pos.coords.longitude
      );

      new kakao.maps.CustomOverlay({
        position: currentPosition,
        content:
          '<div style="width:14px;height:14px;background:#007bff;border:3px solid #fff;border-radius:50%;"></div>',
        map
      });
    });
  }
});

/* 📍 내 위치 기준 검색 */
function moveToMyLocation() {
  if (!currentPosition) return;

  isNearMode = true;
  map.panTo(currentPosition);
  map.setLevel(4);
  searchHospitals();
}

/* 진료과 탭 */
function switchTab(category, btn) {
  currentCategory = category;
  isNearMode = false;

  document.querySelectorAll('.tab-button').forEach(b =>
    b.classList.remove('active')
  );
  btn.classList.add('active');

  searchHospitals();
}

/* 병원 검색 */
function searchHospitals() {
  const keyword = document.getElementById("keyword").value.trim();

  // ⭐ 지역 + 진료과 결합
  const query = keyword
    ? `${keyword} ${currentCategory}`
    : currentCategory;

  const options = isNearMode && currentPosition
    ? {
        location: currentPosition,
        radius: 2000,
        category_group_code: "HP8"
      }
    : {
        category_group_code: "HP8"
      };

  placesService.keywordSearch(query, (data, status) => {
    if (status === kakao.maps.services.Status.OK) {
      displayPlaces(data);
    } else {
      clearMarkers();
      document.getElementById("resultList").innerHTML =
        `<div style="padding:20px;text-align:center;color:#999;">결과 없음</div>`;
    }
  }, options);
}

/* 검색 결과 표시 */
function displayPlaces(places) {
  clearMarkers();
  const list = document.getElementById("resultList");
  list.innerHTML = "";

  const bounds = new kakao.maps.LatLngBounds();

  places.forEach(place => {
    const pos = new kakao.maps.LatLng(place.y, place.x);

    const marker = new kakao.maps.Marker({ position: pos, map });
    markers.push(marker);

    if (!isNearMode) bounds.extend(pos);

    const item = document.createElement("div");
    item.className = "place-item";
    item.innerHTML = `
      <div class="place-name">${place.place_name}</div>
      <div class="place-address">${place.address_name}</div>
    `;

    item.onclick = () => {
      map.panTo(pos);
      map.setLevel(4);
    };

    list.appendChild(item);
  });

  if (!isNearMode && places.length > 0) {
    map.setBounds(bounds);
  }
}

/* 마커 초기화 */
function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

/* 엔터로 검색 */
document.getElementById("keyword").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    isNearMode = false;
    searchHospitals();
  }
});
</script>
</body>
</html>
