<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오맵 장소 검색</title>

  <!-- 카카오 지도 SDK (services: 장소 검색용) -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=26af8b5871fd92c2781d578f68c9982c&libraries=services&autoload=false">
  </script>

  <style>
    /* 전체 화면 설정 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* 좌우 2분할 레이아웃 */
    .container {
      display: flex;
      height: 100%;
    }

    /* 왼쪽 영역 (검색 + 리스트) */
    .sidebar {
      width: 35%;
      padding: 15px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    /* 오른쪽 영역 (지도) */
    #map {
      width: 65%;
      height: 100%;
    }

    /* 검색창 */
    .search-box {
      display: flex;
      margin-bottom: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    .search-box button {
      padding: 8px 12px;
      cursor: pointer;
    }

    /* 검색 결과 리스트 */
    .place-item {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .place-item:hover {
      background-color: #f2f2f2;
    }

    .place-name {
      font-weight: bold;
    }

    .place-address {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽: 검색 + 결과 -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="keywordInput" placeholder="검색어를 입력하세요" />
        <button id="searchButton">검색</button>
      </div>
      <div id="resultList"></div>
    </div>

    <!-- 오른쪽: 지도 -->
    <div id="map"></div>
  </div>

  <script>
    // 지도, 장소 검색 객체, 마커 배열
    let map;
    let placesService;
    let markers = [];

    // 카카오 지도 SDK 로드 완료 후 실행
    kakao.maps.load(function () {
      // 위치 권한 요청
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // 지도 생성
            const mapContainer = document.getElementById("map");
            const mapOption = {
              center: new kakao.maps.LatLng(latitude, longitude),
              level: 5 // 확대 레벨
            };

            map = new kakao.maps.Map(mapContainer, mapOption);

            // 장소 검색 서비스 객체 생성
            placesService = new kakao.maps.services.Places();

            // 현재 위치 마커 표시
            const currentMarker = new kakao.maps.Marker({
              position: new kakao.maps.LatLng(latitude, longitude),
              map: map
            });

          },
          function () {
            alert("위치 정보를 가져올 수 없습니다.");
          }
        );
      } else {
        alert("이 브라우저에서는 위치 기능을 지원하지 않습니다.");
      }
    });

    // 검색 버튼 클릭 이벤트
    document.getElementById("searchButton").addEventListener("click", searchPlaces);

    // 장소 검색 함수
    function searchPlaces() {
      const keyword = document.getElementById("keywordInput").value;

      if (!keyword) {
        alert("검색어를 입력하세요.");
        return;
      }

      // 키워드 장소 검색
      placesService.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);
        } else {
          alert("검색 결과가 없습니다.");
        }
      });
    }

    // 검색 결과 표시
    function displayPlaces(places) {
      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성
        const marker = new kakao.maps.Marker({
          position: position,
          map: map
        });

        markers.push(marker);
        bounds.extend(position);

        // 리스트 아이템 생성
        const item = document.createElement("div");
        item.className = "place-item";
        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">${place.address_name}</div>
        `;

        // 리스트 클릭 시 해당 위치로 이동
        item.addEventListener("click", function () {
          map.setCenter(position);
        });

        resultList.appendChild(item);
      });

      // 모든 검색 결과가 보이도록 지도 범위 조정
      map.setBounds(bounds);
    }

    // 마커 제거 함수
    function removeMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];
    }
  </script>
</body>
</html>
